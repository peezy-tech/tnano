packages:
  - apps/tnano
  - packages/tnano-*

# Successor to onlyBuiltDependencies/ignoredBuiltDependencies (pnpm 11).
allowBuilds:
  bufferutil: false
  esbuild: true
  msw: false
  utf-8-validate: false

catalog:
  "@types/node": 24.12.4
  "@typescript/native-preview": 7.0.0-dev.20260604.1
  vite: npm:@voidzero-dev/vite-plus-core@0.2.2
  vite-plus: 0.2.2

overrides:
  vite: "catalog:"

packageExtensions:
  vite-plus@*:
    dependencies:
      vite: "catalog:"

supportedArchitectures:
  cpu: [current, x64]
  libc: [current, glibc]
  os: [current, linux]
